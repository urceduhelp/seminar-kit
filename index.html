<style>
:root{--fg:#2b2b2b;--muted:#6b6b70;--line:#d2d1cf;--red:#BC3A19;--peach:#FBDAA3;--green:#D3E6A6;--gray:#D2D1CF;--bg:#EFEFEF;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{max-width:1280px;margin:0 auto 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--red);flex:1 1 280px;text-align:center;font-size:clamp(22px,3.2vw,38px);font-weight:700;line-height:1.4}
.admin{font:inherit;font-size:14px;padding:8px 18px;border-radius:99px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.admin:hover{box-shadow:0 6px 16px rgba(0,0,0,.14)}
.grid{max-width:1280px;margin:0 auto;display:grid;gap:clamp(14px,2vw,26px);grid-template-columns:repeat(auto-fill,minmax(clamp(150px,22vw,230px),1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:clamp(130px,16vw,180px);padding:18px 12px;text-align:center;text-decoration:none;color:var(--fg);
  font:inherit;font-weight:600;font-size:clamp(15px,1.5vw,20px);line-height:1.45;
  background:#fff;border:1px solid var(--line);border-radius:22px;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  transition:transform .22s ease,box-shadow .22s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-5px) scale(1.06);outline:none;
  box-shadow:0 18px 32px rgba(0,0,0,.18),inset 3px 3px 7px #fff,inset -3px -3px 9px rgba(0,0,0,.09)}
.tile:hover,.tile:focus-visible{border-color:var(--red)}
.tile:active{transform:scale(1.02);box-shadow:0 6px 12px rgba(0,0,0,.14),inset 2px 2px 6px rgba(0,0,0,.10)}
.ic{width:clamp(52px,6vw,74px);aspect-ratio:1;display:grid;place-items:center;border-radius:24px;background:var(--p,var(--peach));box-shadow:inset 0 -3px 6px rgba(0,0,0,.06)}
.ic svg{width:54%;height:54%;fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lb{overflow-wrap:anywhere;word-break:normal}
.tile.off{cursor:default;opacity:.5}
.tile.off:hover{transform:none;box-shadow:0 6px 16px rgba(0,0,0,.10)}
.tag{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--gray);color:var(--muted)}
dialog{border:0;padding:0;border-radius:24px;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);color:var(--fg);background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{background:var(--peach);border-radius:24px 24px 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:clamp(18px,2.4vw,24px)}
.x{font:inherit;font-size:22px;line-height:1;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.10)}
.db{padding:16px 22px 22px;overflow:auto;max-height:calc(100vh - 130px)}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.item a{flex:1;min-width:0;color:var(--fg);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.item a:hover{color:var(--red);text-decoration:underline}
.item small{display:block;color:var(--muted);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.10);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.16)}
.btn.dark{background:var(--red);color:#fff;border-color:var(--red)}
.empty,.msg{color:var(--muted);padding:14px 0;margin:0}
.msg.err{color:#b3261e}
form{display:grid;gap:10px;margin-top:14px}
input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid #cfcfd6;background:#fff;color:var(--fg);width:100%}
input:focus{outline:2px solid var(--red);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:480px){.item{flex-wrap:wrap}.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.tile,.btn{transition:none}.tile:hover{transform:none}}
</style>
</head>

<h2>සිතියම් ලේඛනයක් තනමු – උපදෙස්</h2>
<p>සිතියම් ස්ථාන 12 බැගින් සමූහ 10ක් තනන්න. ඉන් 6ක් ලංකාවට අදාළ විය යුතු අතර 4ක් ලෝක සිතියමට අදාළ විය යුතු ය. ඒ එක් එක් සමූහයක් පහත සංයුතිය අනුව තැනිය යුතු වේ.</p>
<h3>ලංකා සිතියම් සඳහා</h3>
<ul>
<li>ගංගා 2ක්</li>
<li>වරාය 2ක්</li>
<li>වැව්, අමුණු හා ඇළමාර්ග ඇසුරෙන් ස්ථාන 2ක්</li>
<li>රාජධානි හා උප පාලන මධ්‍යස්ථාන ඇසුරෙන් ස්ථාන 2ක්</li>
<li>යටත් විජිත සමයට සම්බන්ධ ස්ථාන 1ක්</li>
<li>ප්‍රාග් හා පූර්ව ඓතිහාසික ස්ථාන අතරින් 1ක්</li>
<li>පූජනීය වැදගත්කමක් ඇති ස්ථාන 1ක්</li>
<li>නිදහසින් පසු වඩාත් කැපී පෙනුණු නගරයක්</li>
</ul>
<h3>ලෝක සිතියම සඳහා</h3>
<ul>
<li>යුරෝපය හා ආසියාව නියෝජනය වන පරිදි රටවල් 2ක්</li>
<li>මුහුදු, සාගර, සමුද්‍රසන්ධි, මුහුදු බොකු, කෘත්‍රිම ඇළ මාර්ග අතරින් 2ක්</li>
<li>යුරෝපයේ කැපී පෙනෙන නගර 2ක්</li>
<li>දකුණු ආසියාවේ කැපී පෙනෙන නගර 2ක්</li>
<li>අග්නිදිග ආසියාවේ කැපී පෙනෙන නගර 2ක්</li>
<li>දූපතක් හෝ දූපත් රාජ්‍යය 1ක්</li>
<li>ලෝක යුද්ධයට හෝ පුනරුදයට සම්බන්ධ නගර 1ක්</li>
</ul>

var panel=$("panel"),loginD=$("login"),adminBtn=$("adminBtn");

function applyAdmin(v){isAdmin=!!v;adminBtn.textContent=isAdmin?"Admin පිටවීම":"Admin පිවිසුම";if(cur&&panel.open)render();}
/* ලොග් වී ඇති සෑම කෙනෙක්ම නොව, admins වගුවේ ඇති (is_admin) අයට පමණක් පාලන පෙන්වයි.
   is_admin() ශ්‍රිතය තවම සාදා නැත්නම් පමණක් session එක අනුව පෙන්වයි (DB policy ආරක්ෂාව වෙනම පවතී). */
function setAdmin(s){
  if(!s||!sb){applyAdmin(false);return;}
  var t=sb.rpc("is_admin");
  t.then(function(r){applyAdmin(r.error?true:r.data===true);},function(){applyAdmin(true);});
}
if(sb){
  sb.auth.getSession().then(function(r){setAdmin(r.data&&r.data.session);});
  sb.auth.onAuthStateChange(function(_e,s){setAdmin(s);});
}
adminBtn.addEventListener("click",function(){
  if(isAdmin){sb.auth.signOut();}
  else{$("lMsg").textContent="";loginD.showModal();}
});
$("lClose").addEventListener("click",function(){loginD.close();});
$("pClose").addEventListener("click",function(){panel.close();});
[panel,loginD].forEach(function(d){d.addEventListener("click",function(e){if(e.target===d)d.close();});});

$("lForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!sb){$("lMsg").className="msg err";$("lMsg").textContent="Supabase සම්බන්ධ නොවීය.";return;}
  $("lMsg").className="msg";$("lMsg").textContent="පරීක්ෂා කරමින්...";
  sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value}).then(function(r){
    if(r.error){$("lMsg").className="msg err";$("lMsg").textContent="Email හෝ Password වැරදියි.";}
    else{$("lPass").value="";loginD.close();}
  });
});

var rows=[],status="";
function openPanel(t){
  cur=t;rows=[];status="ප්‍රවේශ වෙමින්...";
  $("pTitle").textContent=t.n;render();panel.showModal();
  if(!sb){status="Supabase සම්බන්ධ නොවීය.";render();return;}
  load();
}
function load(){
  var c=cur.cat;
  sb.from("links").select("*").eq("category",c).order("created_at",{ascending:false}).then(function(r){
    if(!cur||cur.cat!==c)return;
    if(r.error){status="Link ලබා ගැනීමට නොහැකි විය.";rows=[];}
    else{rows=r.data||[];status=rows.length?"":"තවම Link නැත.";}
    render();
  });
}
function normUrl(u){u=u.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:"";}catch(e){return"";}}
function copyText(txt,btn){
  var done=function(){var o=btn.textContent;btn.textContent="පිටපත් විය ✓";setTimeout(function(){btn.textContent=o;},1500);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){fb();});}else fb();
  function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();}
}
function render(){
  var L=$("pList"),A=$("pAdd");L.innerHTML="";A.innerHTML="";
  if(status){var p=document.createElement("p");p.className="empty";p.textContent=status;L.appendChild(p);}
  rows.forEach(function(r){
    var it=document.createElement("div");it.className="item";
    var a=document.createElement("a");a.href=normUrl(r.url)||"#";a.target="_blank";a.rel="noopener";
    a.textContent=r.title;
    if(cur.copy){var s=document.createElement("small");s.textContent=r.url;a.appendChild(s);}
    it.appendChild(a);
    if(cur.copy){var c=document.createElement("button");c.type="button";c.className="btn";c.textContent="Copy";
      c.addEventListener("click",function(){copyText(r.url,c);});it.appendChild(c);}
    if(isAdmin){var d=document.createElement("button");d.type="button";d.className="btn";d.textContent="ඉවත් කරන්න";
      d.addEventListener("click",function(){
        if(!confirm("මෙම Link එක ඉවත් කරන්නද?"))return;
        sb.from("links").delete().eq("id",r.id).then(function(x){if(x.error)alert("ඉවත් කළ නොහැකි විය.");else load();});
      });it.appendChild(d);}
    L.appendChild(it);
  });
  if(!isAdmin)return; /* admin නොවන විට / logout වූ විට Link එකතු කිරීම සහ ඉවත් කිරීම නොපෙන්වයි */
  var f=document.createElement("form");
  f.innerHTML='<input name="t" placeholder="නම / විස්තරය" required><input name="u" placeholder="Link (https://...)" required><div class="bar"><button class="btn dark" type="submit">Link එකතු කරන්න</button></div><p class="msg" role="alert"></p>';
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var u=normUrl(f.u.value),m=f.querySelector(".msg");
    if(!u){m.className="msg err";m.textContent="වලංගු Link එකක් ඇතුළත් කරන්න.";return;}
    sb.from("links").insert({category:cur.cat,title:f.t.value.trim(),url:u}).then(function(r){
      if(r.error){m.className="msg err";m.textContent="එකතු කළ නොහැකි විය. නැවත පිවිසෙන්න.";}
      else{f.reset();load();}
    });
  });
  A.appendChild(f);
}
</script>
</body>
</html>
