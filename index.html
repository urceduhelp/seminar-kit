<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap">
<style>
:root{
  --bg1:#0a1930;--bg2:#12284c;--glow:rgba(245,196,81,.16);--glow2:rgba(95,211,188,.12);
  --fg:#f4f6fb;--muted:#9fb0cf;--gold:#f5c451;
  --card:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  --bd:rgba(255,255,255,.14);--sh:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  --sh-h:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg1:#f7f3ea;--bg2:#e9eef8;--glow:rgba(245,196,81,.30);--glow2:rgba(95,211,188,.22);
  --fg:#12284c;--muted:#5a6b8c;--gold:#b8860b;
  --card:linear-gradient(150deg,#ffffff,#f3f6fc);--bd:rgba(18,40,76,.10);
  --sh:0 8px 24px rgba(18,40,76,.10),inset 0 1px 0 #fff;--sh-h:0 16px 36px rgba(18,40,76,.18),inset 0 1px 0 #fff;
  color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;gap:14px;color:var(--fg);
  font-family:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",sans-serif;
  background:radial-gradient(900px 500px at 12% -10%,var(--glow),transparent 60%),
             radial-gradient(800px 500px at 100% 110%,var(--glow2),transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
header{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;padding:4px 0}
header .mark{font-size:clamp(26px,3.4vw,44px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
header h1{margin:0;font-size:clamp(20px,2.8vw,38px);font-weight:700;letter-spacing:.2px;
  background:linear-gradient(90deg,var(--gold),var(--fg) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{height:1px;border:0;margin:0 auto;width:min(520px,70%);background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.grid{flex:1;min-height:0;display:grid;gap:clamp(10px,1.4vw,18px);grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(120px,1fr)}
.tile{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,16px);
  padding:14px;text-align:center;text-decoration:none;color:var(--fg);
  background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-weight:600;font-size:clamp(15px,1.9vw,26px);line-height:1.4;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;z-index:1;background:linear-gradient(90deg,transparent,var(--a),transparent)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--a) 30%,transparent),transparent 68%)}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);box-shadow:var(--sh-h);border-color:color-mix(in srgb,var(--a) 70%,transparent);outline:none}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
.tile:focus-visible{box-shadow:0 0 0 3px var(--a),var(--sh-h)}
.tile:active{transform:translateY(-1px) scale(.985)}
.ic{
  width:clamp(54px,6vw,92px);aspect-ratio:1;display:grid;place-items:center;border-radius:30%;
  font-size:clamp(26px,3.4vw,48px);line-height:1;
  background:linear-gradient(145deg,color-mix(in srgb,var(--a) 70%,#fff),var(--a));
  box-shadow:0 10px 22px color-mix(in srgb,var(--a) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.tile:hover .ic{transform:scale(1.08) rotate(-3deg)}
.lb{padding:0 4px}
.tile.off{cursor:default;opacity:.55;filter:saturate(.6)}
.tile.off:hover{transform:none;box-shadow:var(--sh);border-color:var(--bd)}
.tile.off:hover::after{opacity:0}
.tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px;
  background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){html,body{height:auto;min-height:100%}.grid{grid-template-columns:repeat(2,1fr);flex:none}}
@media(prefers-reduced-motion:reduce){.tile,.ic,.tile::after{transition:none}.tile:hover{transform:none}}
</style>
</head>

<h2>සිතියම් ලේඛනයක් තනමු – උපදෙස්</h2>
<p>සිතියම් ස්ථාන 12 බැගින් සමූහ 10ක් තනන්න. ඉන් 6ක් ලංකාවට අදාළ විය යුතු අතර 4ක් ලෝක සිතියමට අදාළ විය යුතු ය. ඒ එක් එක් සමූහයක් පහත සංයුතිය අනුව තැනිය යුතු වේ.</p>
<h3>ලංකා සිතියම් සඳහා</h3>
<ul>
<li>ගංගා 2ක්</li>
<li>වරාය 2ක්</li>
<li>වැව්, අමුණු හා ඇළමාර්ග ඇසුරෙන් ස්ථාන 2ක්</li>
<li>රාජධානි හා උප පාලන මධ්‍යස්ථාන ඇසුරෙන් ස්ථාන 2ක්</li>
<li>යටත් විජිත සමයට සම්බන්ධ ස්ථාන 1ක්</li>
<li>ප්‍රාග් හා පූර්ව ඓතිහාසික ස්ථාන අතරින් 1ක්</li>
<li>පූජනීය වැදගත්කමක් ඇති ස්ථාන 1ක්</li>
<li>නිදහසින් පසු වඩාත් කැපී පෙනුණු නගරයක්</li>
</ul>
<h3>ලෝක සිතියම සඳහා</h3>
<ul>
<li>යුරෝපය හා ආසියාව නියෝජනය වන පරිදි රටවල් 2ක්</li>
<li>මුහුදු, සාගර, සමුද්‍රසන්ධි, මුහුදු බොකු, කෘත්‍රිම ඇළ මාර්ග අතරින් 2ක්</li>
<li>යුරෝපයේ කැපී පෙනෙන නගර 2ක්</li>
<li>දකුණු ආසියාවේ කැපී පෙනෙන නගර 2ක්</li>
<li>අග්නිදිග ආසියාවේ කැපී පෙනෙන නගර 2ක්</li>

</ul>
