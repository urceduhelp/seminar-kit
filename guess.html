•	කිතුල්ගල බෙලිලෙන-	වර්ෂ 10500කට පෙර මේ ලෙනෙහි විසූ ප්‍රාග් ඓතිහාසික වැසියෝ ආහාරයට ගත් වල්දෙල් හා අළුකෙසෙල් පිළිබඳ සාධක මෙහි තිබී හමුවී තිබේ. (6 පාඩම)
•	තෝණිගල-	මේ ස්ථානයේ තිබී හමුවූ සෙල් ලිපියක වී, උඳු, මුං සහ තල පිළිබඳව සඳහන් වී ඇත. ඒ ලිපිය කීර්ති ශ්‍රී මේඝ වර්ණාභය රජ දවසට අයත් වේ යැයි සොයාගෙන තිබේ. (6 පාඩම)
•	තෝණිගල-	මෙම ස්ථානයේ තිබී හමු වූ ලිපියක භික්ෂූන් උදෙසා අතුරුපස වශයෙන් තල පූජා කළ බව සඳහන් වේ. මේ ලිපිය කිත්සිරිමෙවන් රජ සමයට අයත් වේ. (6 පාඩම)
•	අනුරාධපුරය-	මේ පැරණි අගනගරයට සමීපව පිහිටුවා ඇති පුවරු ලිපියකින් හතරවන මිහිඳු රජු විසින් ගොඩ ඉඩම්වල කැලෑ නොකැපිය යුතු බවට නියෝග කර තිබේ. (6 පාඩම)
•	අනුරාධපුරය-	මේ ප්‍රදේශයේ ඇති බුද්ධන්නෙහෙළ නම් ස්ථානයේ සෙල්ලිපියක ‘ වල්වල දඬුපත් නොකපනු ඉසා ‘ යනුවෙන් සඳහන් වේ. මේ ලිපිය තුන්වන උදය රජුට අයත් එකකි. (6 පාඩම)
•	අනුරාධපුරය-	ශ්‍රී ලංකාවේ පළමු නාගරීකරණ අවධිය පිළිබිඹු කරන එක් නගරයකි. ආහාරවලින් ස්වයංපෝෂී වීම ඇතුළු කරුණු කිහිපයක් මත වර්ෂ 1400ක් පමණ නොපිරිහී පැවතියේය. (7 පාඩම)
•	මාගම- ශ්‍රී ලංකාවේ මුල්නාගරීකරණ අවධිය පිළිබිඹු කරන නගරයකි. (7 පාඩම)
•	තිස්සමහාරාමය-	මෙහි කැණීම්වලදී විදේශවලින් ආනයනය කරන ලද මැටි භාණ්ඩ, පබළු වැනි දේ සොයාගෙන තිබේ. (7 පාඩම) 
•	අනුරාධපුරය-	පණ්ඩුකාභය රජු විසින් සිය අගනගරය කරගත්තේ මේ නගරයයි. හේ ඉතා ක්‍රමවත් අයුරින් , සැලසුම් සහගතව මෙම නගරය සංවර්ධනය කළේය. (7 පාඩම) 
•	දඹදෙණිය-	දෙවන පරාක්‍රමබාහු රජුගේ මධ්‍යස්ථානය වූයේ ද මේ ස්ථානයයි. දෙවන නාගරීකරණ යුගය ඇරඹේ. 
•	පොළොන්නරුව-	ලංකාවේ මුල් නාගරීකරණ අවධියට අයත් අගනගරයක් වේ. මහා විජයබාහු රජු කාලීන වාණිජ හා දේශපාලන ප්‍රවණතා සලකා මේ නගරය අගනගරය වශයෙන් තෝරාගෙන සංවර්ධනය කළේය. (7 පාඩම) 
•	පොළොන්නරුව-	 මහාවිජයබාහු, මහාපරාක්‍රමබාහු ආදී රජවරුන් විසින් සමෘද්ධිමත් භාවයට පත්කළ මේ නගරය නිශ්ශංකමල්ල රජුට පසු පත්වූ පාලකයන් අතින් පරිහානියට පත්ව ක්‍රමයෙන් බිඳවැටුණි. (7 පාඩම)
•	දඹදෙණිය-	දෙවන නාගරීකරණ යුගයට අයත් පළමු අගනගරයයි. වන්නි රාජ්‍යවල සිට ආ පාලකයකු විසින් පළමුකොටම ස්ථාපනය කරන ලදී. (7 පාඩම)
•	යාපහුව-	කාලිංග මාඝ පොළාන්නරුවේ සිටි කාලයේදී මේ ස්ථානයේ වූ පර්වතයක ‘ගිරි බලකොටුවක් කරවූ සුභ නම් සෙනෙවියා කාලිංග මාඝ ගේ ව්‍යාප්තිය යම් තරමකට හෝ සීමා කිරීමට සමත් විය. (7 පාඩම)
•	ගෝවින්ද මලය-	ගල් ඔයට සමීප මෙම ස්ථානයේ බුවනෙකබාහු ආදිපාදවරයා බලකොටුවක් තනාගෙන සිටියේය. මේ නිසා කාලිංග මාඝ තවදුරටත් දකුණු දෙසට පැමිණීම වැලකුණි. (7 පාඩම)
•	මහියංගනය-	මෙයට ආසන්න ගංදෙණිය නම් ස්ථානයේ සංඛ සෙනෙවි සිය මධ්‍යස්ථානය කරගත් අතර මේ නිසා කාලිංග මාඝ තවදුරටත් දකුණු දෙසට පැමිණීම වැලකුණි. දුටුගැමුණු රජු එළාර හා කළ යුද්ධය ඇරඹුයේ ද මෙතැනින් වන අතර බුදුන් වහන්සේගේ ලංකාගමනයන් හා සම්බන්ධ පූජනීය ස්ථානයක් ද වේ. (7 පාඩම)
•	කොත්මලේ-	පොළොන්නරුව කාලිංග මාඝගේ ග්‍රහණයට නතුවීමත් සමග දළදා වහන්සේ ආරක්ෂාව සහිතව සඟවා තැබුයේ මෙහිය. පසුකාලීනව මේ ප්‍රදේශය ප්‍රකට වූයේ නිදහසින් පසු ශ්‍රී ලංකාවේ ක්‍රියාත්මක වූ වාරි ව්‍යාපෘතියකට අයත් ජලාශයක් තිබීම නිසාවෙනි.  (7 පාඩම)
•	බෙලිගල-	තෙවන විජයබාහු රජතුමා දඹදෙණිය සිය මධ්‍යස්ථානය කරගත් පසු දළදා වහන්සේ උදෙසා මෙහි දළදා මන්දිරයක් කරවීය. (7 පාඩම)
•	දඹදෙණිය-	තෙවන විජයබාහු රජතුමා විසින් මෙහි විජයසුන්දරාරාමය නමින් වෙහෙරක් කරවා ඇත. (7 පාඩම)
•	කැළණිය-	ලංකාවේ ඉපැරණි පුදබිමක් වන මෙය කැළණි නදිය අසල පිහිටා තිබේ. තෙවන විජයබාහු රජු මෙහි වූ විහාරය ප්‍රතිසංස්කරණය කළ අතර ලංකාවේ සුප්‍රකට ධාන්‍යාකාර ස්තූපය පිහිටා ඇත්තේ ද මෙහිය. (7 පාඩම)
•	දඹදෙණිය - දෙවන පරාක්‍රමබාහු රජුගේ මධ්‍යස්ථානය වූයේ ද මේ ස්ථානයයි. දෙවන නාගරීකරණ යුගය ඇරඹෙන්නේ මේ ස්ථානය ලංකාවේ පාලන මධ්‍යස්ථානය බවට පත්වීමත් සමගිනි. (7 පාඩම)
•	මලය අර්ධද්වීපය- චන්ද්‍රභානු නම් ආක්‍රමණිකයා ලංකාවට පැමිණෙන්නේ මෙම අර්ධද්වීපයේ උතුරු ප්‍රදේශයේ සිටය. ඉන්දීය සාගර කලාපයේ සිට අග්නිදිග ආසියාතික ප්‍රදේශවලට ප්‍රධාන දොරටුව ද මේ අර්ධද්වීපය අසලින් වැටී තිබේ. (7 පාඩම)
•	යාපහුව- බෝසත් විජයබාහු රජු රජ මැදුරේ කුමන්ත්‍රණයකින් ජීවිතක්ෂයට පත්වූ පසු ඔහුගේ සොහොයුරා මෙම නව රාජ්‍ය පාලන මධ්‍යස්ථානයේ බලයට පත්විය. ඔහු එහි රජවූ පළමුවැන්නා මෙන්ම ඒ නමින් බලයට පත් වූ පළමු වැන්නා ද වේ. (7 පාඩම)
•	කයිරෝ- ලංකාවේ යාපහුව රාජධානියේ ආරම්භක පාලකයා විසින් මෙම නගරයට දූතයින් එවන ලදුව එහි එවක සුල්තාන්වරයා විසින් 1283 වර්ෂයේදී මේ දූත පිරිස පිළිගන්නා ලදී. (7 පාඩම)
•	යාපහුව-	පළමු බුවනෙකබාහු රජුගේ අභාවයට පසු ඇති වූ මතභේදකාරී වාතාවරණය මැද මේ ස්ථානය වැටලූ ආර්ය චක්‍රවර්තී නම් ඉන්දීය ප්‍රාදේශීය පාලකයකු, එහි වූ දළදා වහන්සේ රැගෙන ගොස් පාණ්ඩ්‍ය රජුජ භාර දුන්නේය. (7 පාඩම)
•	පොළොන්නරුව- පාණ්ඩ්‍ය දේශයට ගොස් එහි පාලකයා හා සාකච්ඡා කළ තෙවන පරාක්‍රමබාහු කුමරා එවක එහි තිබූ දළදා වහන්සේ යළි ලක්දිවට වඩමවාගෙන පැමිණ මේ නගරය මුල්කරගෙන රජවිය. 	       (7 පාඩම)
•	කුරුණෑගල-	1293 වර්ෂයේදී පොළොන්නරුව වැටලූ දෙවන බුවනෙකබාහු කුමාරයා එහි එවකට සිටි තෙවන පරාක්‍රමබාහු රජු පරදා දළදා වහන්සේ ද රැගෙන විත් මේ ස්ථානය අගනුවර කරගනිමින් බලයට පත්වී ඇත. (7 පාඩම)
•	කුරුණෑගල-	එතෙක් පාළි බසින් තිබූ පන්සියපනස් ජාතක පොත්වහන්සේ සිංහල බසට පරිවර්තනය කරන ලද්දේ මේ ස්ථානය ලංකාවේ අගනුවර වශයෙන් පැවති යුගයේය. (7 පාඩම)
•	ගම්පොළ-	සවුළු විජයබාහු රජුගේ පුත්‍රයෙකු මේ ස්ථානයේ අභිනව රාජ්‍යයක් පිහිටුවා ගත්තේය. ඒ රජු ඒ නමින් සිටි සිව්වැන්නා ද වේ. ආරම්භක ස්ථානයේ සිට මහවැලි ගඟ ඔස්සේ ත්‍රිකුණාමලයට යන්නෙකුට ලංකාවේ රාජධානි 03ක් හමුවන අතර ඉන් පළමුවැන්න වන්නේ ද මෙයයි. (7 පාඩම)
•	කුරුණෑගල-	දළදා සිරිත, සිංහල බෝධිවංසය, අනාගත වංසය හා දළදා පූජාවලිය යන ග්‍රන්ථ රචනා වූයේ මේ නගරය ලංකාවේ අගනගරය වශයෙන් පැවති කාලයේ දීය. (7 පාඩම)
•	දැදිගම-	සිව්වන බුවනෙකබාහු රජුගේ සොහොයුරු වූ පස්වන පරාක්‍රමබාහු කුමාරයා විසින් මේ ස්ථානයේ පාලන මධ්‍යස්ථානයක් පිහිටුවාගන්නේ සිය සොහොයුරාගේ පාලන කාලය තුළදීමය.               (7 පාඩම)   
•	යාපනය-	ගම්පොළ රාජධානි සමයේ මේ ස්ථානය මුල්කරගත් රාජ්‍යක් ද බිහිවී ඇත. පසු කාලීනව බලයට ආ 6වන පරාක්‍රමබාහු රජු සපුමල් කුමරු යටතේ යැවූ හමුදාවක් මගින් මේ රාජ්‍යය යටත් කරගෙන ඇත. (7 පාඩම)
•	රයිගම-	කළු ගඟට නුදුරු ස්ථානයකි. අලකේශ්වරවරුන්ගේ මුල් මධ්‍යස්ථානය විය.
•	ගම්පොළ-	සේනාධිලංකාර සෙනවිරත් පවුල මේ ප්‍රදේශයේ සිටි අතර රාජධානියක් වශයෙන් ද ප්‍රකට විය. (7 පාඩම)
•	දැදිගම-	මෙහි සිටි පාලකයාගේ සොහොයුරිය සේනාධිලංකාර පරපුරේ අයෙකු හා විවාහ වූ අතර පසුව එම දෙදෙනාගේ පුත්‍රයා III  වන විජයබාහු නමින් ගම්පොළ රජවිය. (7 පාඩම)
•	ගම්පොළ-	මේ රාජ්‍ය මධ්‍යස්ථානයේ එක් පාලකයකු වූයේ දැදිගම පරාක්‍රමබාහු රජුගේ සොහොයුරියගේ පුත්‍රයාය. දැදිගම පරාක්‍රමබාහු රජුගේ සොහොයුරිය විවාහ වී සිටියේ මේ නගරයේ සිටි ප්‍රභූ පවුලක සාමාජිකයෙකු සමගිනි. (7 පාඩම)
•	ගම්පොළ-	මේ ස්ථානය මුල්කරගත් රාජධානි සමයේ දී ඉබන් බතූතා ද ලංකාවට පැමිණ ඇත. (7 පාඩම)
•	ගම්පොළ-	තෙවන වික්‍රමබාහු රජු මේ ස්ථානයේ සිට පාලන කටයුතු මෙ‍හෙයවමින් සිටියදී යාපනය පාලකයා මේ රාජ්‍යයට අයත් ප්‍රදේශවල බදු අය කළේය. (7 පාඩම)

  N.textContent = i<0 ? "ඉඟිය පෙන්වන්න" : "ඊළඟ ඉඟිය ▶";
}
N.onclick=function(){ if(i<items.length-1){i++;render();} else {C.textContent="අවසානයි! 🎉";} };
document.getElementById("prev").onclick=function(){ if(i>0){i--;render();} };
document.getElementById("ans").onclick=function(){
  if(i<0) return; A.className="answer"; A.textContent=items[i].a;
};
document.getElementById("load").onclick=function(){
  var d=parse(document.getElementById("paste").value);
  if(d.length){items=d;i=-1;render();}
};
items=parse(SAMPLE); render();
</script>
